name: Kiểm chứng game
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests, CLI and replay
        run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: docs/proof/
